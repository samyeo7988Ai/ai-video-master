<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>AI 视频大师 V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:24px;margin:6px 0}.sub{color:#94a3b8;font-size:13px}.card{background:#111827;border:1px solid #263247;border-radius:18px;padding:16px;margin-top:14px}
label{display:block;font-size:13px;color:#cbd5e1;margin:0 0 7px}textarea,input,select{width:100%;border:1px solid #334155;background:#0f172a;color:#fff;border-radius:12px;padding:12px;font:inherit}
textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0}.chip{white-space:nowrap;border:1px solid #334155;background:#172033;color:#dbeafe;padding:9px 12px;border-radius:999px}.chip.active{border-color:#60a5fa;background:#172554}
button{border:0;border-radius:12px;padding:12px 14px;background:#2563eb;color:#fff;font-weight:700;font-size:14px}button.secondary{background:#1e293b}button:disabled{opacity:.45}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.preview{width:100%;aspect-ratio:9/16;background:#020617;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.preview img{max-width:100%;max-height:100%;object-fit:cover}.overlay{position:absolute;left:10%;right:10%;bottom:8%;text-align:center;text-shadow:0 2px 12px #000;font-weight:800;font-size:22px}.small{font-size:12px;color:#94a3b8;line-height:1.5}.scene{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #263247}.thumb{width:72px;height:100px;background:#1e293b;border-radius:9px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.scene b{font-size:13px}.scene p{margin:5px 0;color:#cbd5e1;font-size:12px;line-height:1.5}
#status{margin-top:10px;color:#93c5fd;font-size:12px;min-height:18px}
@media(max-width:500px){.row{grid-template-columns:1fr}.wrap{padding:12px 10px 60px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>🎬 AI 视频大师</h1><div class="sub">手机端 · 产品广告 V1 · 本地免费运行</div></div><button class="secondary" id="installBtn" hidden>安装 App</button></div>

<div class="card">
<label>① 你的产品 / 广告内容</label>
<textarea id="idea" placeholder="例如：一双男士休闲凉鞋，轻便、防滑，适合日常出门。我要做一个30秒 TikTok 产品广告。"></textarea>
<div class="chips" id="styleChips">
<button class="chip active" data-style="UGC真人感">UGC真人感</button><button class="chip" data-style="电影广告">电影广告</button><button class="chip" data-style="产品展示">产品展示</button><button class="chip" data-style="搞笑短视频">搞笑短视频</button>
</div>
<div class="row" style="margin-top:10px"><div><label>语言</label><select id="lang"><option value="zh">中文</option><option value="ms">Bahasa Melayu</option><option value="en">English</option></select></div><div><label>比例</label><select id="ratio"><option value="9:16">9:16 TikTok/Reels/Shopee</option><option value="1:1">1:1 Facebook</option><option value="16:9">16:9 YouTube</option></select></div></div>
<div class="actions"><button id="gen">✨ 自动生成分镜</button><button class="secondary" id="clear">清空</button></div>
<div id="status"></div>
</div>

<div class="card">
<label>② 上传产品照片（可选）</label>
<input id="photos" type="file" accept="image/*" multiple>
<div class="small" style="margin-top:7px">照片会留在你的手机浏览器里；V1 不会自动上传到服务器。</div>
</div>

<div class="card" id="storyCard" hidden>
<label>③ AI 分镜</label><div id="scenes"></div>
<div class="actions"><button id="voice">🔊 播放口播</button><button class="secondary" id="export">🎥 导出视频</button></div>
<div class="small" style="margin-top:8px">导出的是浏览器本地生成的 MP4/WebM 风格广告片段；真正的云端文生视频模型可在后续版本接入。</div>
</div>

<div class="card" id="previewCard" hidden>
<label>预览</label><div class="preview" id="preview"><div class="small">点击导出后生成预览</div></div>
</div>

<div class="card">
<label>🧠 免费 AI 模型接口（可选）</label>
<input id="endpoint" placeholder="以后可填写你的免费/自建 AI API 地址">
<div class="small" style="margin-top:7px">V1 默认不依赖付费 API。这个位置预留给后续接入开源模型或你自己的服务器。</div>
</div>
</div>
<script>
let chosenStyle="UGC真人感", scenes=[], imgs=[];
const $=s=>document.querySelector(s);
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");chosenStyle=b.dataset.style});
$("#photos").onchange=async e=>{imgs=[]; for(const f of e.target.files){imgs.push(await fileURL(f))} renderScenes()};
function fileURL(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
function makeScenes(){
 const idea=$("#idea").value.trim()||"我的产品";
 const lang=$("#lang").value, l=lang==="zh"?[
 ["0-3秒","强力开场","用一句问题/反差抓住注意力："+idea],
 ["3-8秒","产品出现","近距离展示产品外观、材质和关键细节。"],
 ["8-15秒","真实使用","模拟日常使用场景，镜头自然移动，突出使用体验。"],
 ["15-22秒","卖点证明","连续展示2-3个核心卖点，配合字幕和细节特写。"],
 ["22-27秒","行动引导","展示产品整体与购买场景，加入简短行动号召。"],
 ["27-30秒","结尾","品牌/店铺名称 + 联系方式 + 简洁CTA。"]
 ]:lang==="ms"?[
 ["0-3s","Hook","Mulakan dengan soalan atau situasi yang menarik perhatian: "+idea],
 ["3-8s","Produk","Tunjukkan rupa, bahan dan butiran utama produk secara dekat."],
 ["8-15s","Penggunaan","Tunjukkan penggunaan sebenar dalam suasana harian."],
 ["15-22s","Kelebihan","Serlahkan 2-3 kelebihan utama dengan teks ringkas."],
 ["22-27s","CTA","Tunjukkan produk dan ajakan untuk membeli."],
 ["27-30s","Akhir","Nama kedai/jenama + CTA ringkas."]
 ]:[
 ["0-3s","Hook","Start with a strong question or contrast: "+idea],
 ["3-8s","Product","Show the product, material and key details in close-up."],
 ["8-15s","Use","Show realistic everyday use with natural camera movement."],
 ["15-22s","Benefits","Highlight 2-3 key benefits with short captions."],
 ["22-27s","CTA","Show the product and a clear call to action."],
 ["27-30s","End","Brand/store name + short CTA."]
 ];
 return l.map((x,i)=>({time:x[0],title:x[1],text:x[2],image:imgs[i%Math.max(imgs.length,1)]||""}));
}
function renderScenes(){ if(!scenes.length) return; $("#storyCard").hidden=false; $("#scenes").innerHTML=scenes.map((s,i)=>`<div class="scene"><div class="thumb">${s.image?`<img src="${s.image}">`:""}</div><div><b>${i+1}. ${s.time} · ${s.title}</b><p>${s.text}</p></div></div>`).join("")}
$("#gen").onclick=()=>{scenes=makeScenes();renderScenes();$("#status").textContent="✓ 已生成 6 段广告分镜。";};
$("#clear").onclick=()=>{location.reload()};
$("#voice").onclick=()=>{if(!scenes.length)return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(scenes.map(s=>s.text).join(" ")); u.lang=$("#lang").value==="ms"?"ms-MY":$("#lang").value==="en"?"en-US":"zh-CN";speechSynthesis.speak(u)};
$("#export").onclick=async()=>{if(!scenes.length)return;$("#previewCard").hidden=false;const ratio=$("#ratio").value.split(":");const w=ratio[0]==="16"?1280:720,h=ratio[1]==="16"?1280:ratio[0]==="16"?720:720;const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;const ctx=canvas.getContext("2d");const stream=canvas.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:"video/webm"});let chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:"video/webm"});const url=URL.createObjectURL(blob);$("#preview").innerHTML=`<video controls autoplay loop src="${url}" style="width:100%;height:100%;object-fit:contain"></video>`;const a=document.createElement("a");a.href=url;a.download="AI_Video_Master.webm";a.textContent="⬇️ 保存视频";a.style="display:block;text-align:center;margin-top:12px;color:#93c5fd;font-weight:700";$("#preview").after(a);$("#status").textContent="✓ 视频已在手机浏览器本地生成。";};
rec.start();
for(const s of scenes){ctx.fillStyle="#020617";ctx.fillRect(0,0,w,h);if(s.image){await drawImage(ctx,s.image,w,h)}else{ctx.fillStyle="#0f172a";ctx.fillRect(0,0,w,h)};ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,h*.68,w,h*.32);ctx.fillStyle="#fff";ctx.font=`800 ${Math.max(28,w/24)}px system-ui`;wrapText(ctx,s.title,w/2,h*.77,w*.82,Math.max(28,w/24)*1.3);ctx.font=`500 ${Math.max(18,w/42)}px system-ui`;wrapText(ctx,s.text,w/2,h*.86,w*.82,Math.max(18,w/42)*1.35);await wait(5000)}rec.stop()};
function drawImage(ctx,src,w,h){return new Promise(r=>{const im=new Image();im.onload=()=>{const scale=Math.max(w/im.width,h/im.height),nw=im.width*scale,nh=im.height*scale;ctx.drawImage(im,(w-nw)/2,(h-nh)/2,nw,nh);r()};im.src=src})}
function wrapText(ctx,t,x,y,max,lh){let line="";for(const c of t){if(ctx.measureText(line+c).width>max){ctx.fillText(line,x,y);line=c;y+=lh}else line+=c}ctx.fillText(line,x,y)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});$("#installBtn").onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$("#installBtn").hidden=true}};
</script>
</body></html>
